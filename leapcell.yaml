version: "1.0"

app:
  name: code-commenter-agent
  language: python
  entrypoint: uvicorn app.main:app --host 0.0.0.0 --port 8080
  port: 8080

# Environment variables should be set through Leapcell dashboard for security
# Required variables:
# - MISTRAL_API_KEY: Your Mistral AI API key
# - TELEX_AGENT_API_KEY: Your Telex agent API key (optional)
# - DATABASE_URL: PostgreSQL connection string
# - API_BASE_URL: Your deployed app URL
# - TELEX_CHANNEL: Channel ID for daily tip posting (optional)

build:
  commands:
    - pip install --upgrade pip
    - pip install -r requirements.txt

schedule:
  - name: daily_tip_sender
    cron: "0 8 * * *"    # daily at 08:00 UTC
    command: python daily_task.py
