name: telex-ai-agent
runtime: python3.11

# Build configuration
build:
  commands:
    - pip install -r requirements.txt

# Start command
start: uvicorn app.main:app --host 0.0.0.0 --port $PORT

# Environment variables (you'll set these in Leapcell dashboard)
env:
  - MISTRAL_API_KEY
  - TELEX_AGENT_API_KEY
  - DATABASE_URL
  - SUPABASE_URL
  - SUPABASE_ANON_KEY
  - SUPABASE_SERVICE_ROLE_KEY
  - API_BASE_URL

# Health check
healthcheck:
  path: /ping
  port: $PORT

# Auto-scaling configuration
scaling:
  min_instances: 1
  max_instances: 3